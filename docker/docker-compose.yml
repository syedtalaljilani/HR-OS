services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hr-os-postgres
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: hr_recruitment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: